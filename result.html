<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Download — Favicon Creator</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="stylesheet" href="css/montserrat.css" />
    <link rel="stylesheet" id="googleFontStylesheet" />
    <link rel="stylesheet" href="css/font-awesome.min.css" />
    <script src="js/jszip.min.js"></script>
    <script src="js/FileSaver.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/settings-enums.js"></script>
    <script src="js/design-settings.js"></script>
    <script src="js/fontawesome-paths.js"></script>
    <script src="js/favicon-canvas.js"></script>
    <script src="js/favicon-svg.js"></script>
    <script src="js/favicon-ico.js"></script>
    <script src="js/tab-favicon-preview.js"></script>
    <script src="js/result.js"></script>
    <script src="js/script.js"></script>
  </head>
  <body>
    <div id="header-slot"></div>
    <div id="nav-slot"></div>
    <main>
      <div class="container">
        <div class="text_section">
          <div
            id="favicon_display_container"
            class="favicon_display_container_result"
          ></div>
        </div>
        <div
          class="text_section hide_overflow"
          id="favicon_download_options_container"
        >
          <div class="width_50">
            <p><strong>Image Size</strong></p>
            <div class="checkbox_container">
              <input
                type="checkbox"
                id="download_size1"
                name="download_size"
                checked="checked"
              />
              <label for="download_size1"><span>16 x 16</span></label>
            </div>
            <div class="checkbox_container">
              <input
                type="checkbox"
                id="download_size2"
                name="download_size"
                checked="checked"
              />
              <label for="download_size2"><span>32 x 32</span></label>
            </div>
            <div class="checkbox_container">
              <input
                type="checkbox"
                id="download_size3"
                name="download_size"
                checked="checked"
              />
              <label for="download_size3"><span>64 x 64</span></label>
            </div>
            <div class="checkbox_container">
              <input type="checkbox" id="download_size4" name="download_size" />
              <label for="download_size4"><span>128 x 128</span></label>
            </div>
            <div class="checkbox_container">
              <input type="checkbox" id="download_size5" name="download_size" />
              <label for="download_size5"><span>256 x 256</span></label>
            </div>
          </div>
          <div class="width_50">
            <p><strong>File Type</strong></p>
            <div class="checkbox_container">
              <input
                type="radio"
                id="download_type1"
                name="download_type"
                checked="checked"
              />
              <label for="download_type1"><span>PNG</span></label>
            </div>
            <div class="checkbox_container">
              <input type="radio" id="download_type2" name="download_type" />
              <label for="download_type2"><span>JPG</span></label>
            </div>
            <p><strong>Additional</strong></p>
            <div class="checkbox_container">
              <input
                type="checkbox"
                id="download_svg"
                name="download_pack"
                checked="checked"
              />
              <label for="download_svg"><span>SVG</span></label>
            </div>
            <div class="checkbox_container">
              <input
                type="checkbox"
                id="download_ico"
                name="download_pack"
                checked="checked"
              />
              <label for="download_ico"><span>ICO</span></label>
            </div>
            <div class="checkbox_container">
              <input
                type="checkbox"
                id="download_apple"
                name="download_pack"
                checked="checked"
              />
              <label for="download_apple"><span>Apple Touch (180)</span></label>
            </div>
            <div class="checkbox_container">
              <input
                type="checkbox"
                id="download_manifest"
                name="download_pack"
                checked="checked"
              />
              <label for="download_manifest"><span>Web Manifest</span></label>
            </div>
            <div class="checkbox_container">
              <input
                type="checkbox"
                id="download_html"
                name="download_html"
                checked="checked"
              />
              <label for="download_html"><span>HTML</span></label>
            </div>
            <div class="checkbox_container">
              <input
                type="checkbox"
                id="download_readme"
                name="download_readme"
                checked="checked"
              />
              <label for="download_readme"><span>Read Me</span></label>
            </div>
          </div>
        </div>
        <div class="text_section">
          <div
            id="favicon_download_feedback"
            role="status"
            aria-live="polite"
          ></div>
          <button type="button" class="button" id="favicon_download_button">
            Download
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
