<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings — Favicon Creator</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="stylesheet" href="css/montserrat.css" />
    <link rel="stylesheet" href="css/font-awesome.min.css" />
    <script src="js/partials.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tab-favicon-preview.js"></script>
    <script src="js/script.js"></script>
    <script src="js/settings.js"></script>
  </head>
  <body>
    <div id="header-slot"></div>
    <div id="nav-slot"></div>
    <main>
      <div class="container">
        <div class="text_section">
          <p><strong>Settings</strong></p>
          <div class="settings_row">
            <span class="settings_row_label"
              >Clear all local storage
              <span class="settings_hint">(history, theme, and design)</span></span
            >
            <a class="button button_inline" id="clearLocalStorage">Clear</a>
          </div>
          <div class="settings_row">
            <span class="settings_row_label">Privacy policy</span>
            <a class="button button_inline" href="privacy.html">View</a>
          </div>
        </div>
        <div class="text_section">
          <p><strong>Buy Me a Coffee</strong></p>
          <p>
            If you like this Chrome Extension and fancy buying me a coffee, feel
            free to donate.
          </p>
          <form
            action="https://www.paypal.com/cgi-bin/webscr"
            target="_blank"
            method="post"
            style="margin-bottom: 10px"
          >
            <!-- Identify your business so that you can collect the payments. -->
            <input type="hidden" name="business" value="dbwebdevs@gmail.com" />

            <!-- Specify a Donate button. -->
            <input type="hidden" name="cmd" value="_donations" />

            <!-- Specify details about the contribution -->
            <input type="hidden" name="item_name" value="Buy Me a Coffee" />
            <input
              type="hidden"
              name="item_number"
              value="Chrome Extension - Favicon Creator"
            />
            <input type="hidden" name="currency_code" value="GBP" />

            <!-- Display the payment button. -->
            <input
              type="image"
              name="submit"
              src="https://www.paypalobjects.com/en_US/i/btn/btn_donate_LG.gif"
              alt="Donate"
            />
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
