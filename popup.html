<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="css/styles.css" />
        <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet" />
        <link rel="stylesheet" id="googleFontStylesheet" />
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css" />
        <script src="js/partials.js"></script>
        <script src="js/fontawesome-icons.js"></script>
        <script src="js/google-fonts.js"></script>
        <script src="js/html2canvas.js"></script>
        <script src="js/tab-favicon-preview.js"></script>
        <script src="js/popup.js"></script>
        <script src="js/script.js"></script>
    </head>
    <body>
        <div id="header-slot"></div>
        <div id="nav-slot"></div>
        <main>
            
            <div id="favicon_display_container"></div>

            <div id="favicon_edit_container">

                <div id="favicon_tab_container">
                    <div id="favicon_tab1" class="favicon_tab favicon_tab_active">Visual</div>
                    <div id="favicon_tab2" class="favicon_tab">Background</div>
                    <div id="favicon_tab3" class="favicon_tab">Other</div>
                </div>


                <div id="favicon_edit_container1">

                    <div class="hide_overflow">
                        <div class="input_container input_container_50">
                            <div class="checkbox_container">
                                <input type="radio" id="favicon_edit_type1" name="favicon_edit_type" checked="checked" />
                                <label for="favicon_edit_type1"><span>Text</span></label>
                            </div>
                        </div>
                        <div class="input_container input_container_50">
                            <div class="checkbox_container">
                                <input type="radio" id="favicon_edit_type2" name="favicon_edit_type" />
                                <label for="favicon_edit_type2"><span>Font Awesome</span></label>
                            </div>
                        </div>
                    </div>

                    <div class="hide_overflow">
                        <div class="input_container input_container_50">
                            <label>Text Color</label>
                            <input type="color" value="#FFFFFF" id="favicon_edit_text_color" />
                        </div>
                        
                        <div class="width_50">
                            <div class="favicon_edit_label"><strong>Text Styles</strong></div>
                            <div class="favicon_edit_text_style_container hide_overflow">
                                <div class="favicon_edit_text_style_item" id="favicon_edit_text_style_item_bold">B</div>
                                <div class="favicon_edit_text_style_item" id="favicon_edit_text_style_item_italic">I</div>
                                <div class="favicon_edit_text_style_item" id="favicon_edit_text_style_item_underline">U</div>
                                <div class="favicon_edit_text_style_item" id="favicon_edit_text_style_item_strike">S</div>
                            </div>
                        </div>
                    </div>

                    <div class="hide_overflow">
                        <div class="input_container">
                            <label>Font Size <span id="favicon_edit_font_size_text">(30px)</span></label>
                            <input type="range" min="10" max="50" value="30" id="favicon_edit_font_size" />
                        </div>
                    </div>

                    <div id="favion_edit_type_text">
                        <div class="hide_overflow">
                            <div class="input_container input_container_50">
                                <label>Text</label>
                                <input type="text" id="favicon_edit_text" />
                            </div>
                            <div class="input_container input_container_50">
                                <label for="favicon_edit_google_font">Font Family</label>
                                <select id="favicon_edit_google_font">
                                    <option>Please Select</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="favion_edit_type_fontawesome">
                        <label>FontAwesome</label>
                        <div id="favicon_edit_font_awesome_button">Please Select <i class="fa fa-caret-down" aria-hidden="true"></i></div>
                        <div id="favicon_edit_font_awesome_container">
                            <div id="favicon_edit_font_awesome"></div>
                        </div>
                    </div>

                </div>

                <div id="favicon_edit_container2">
                    
                    <div class="hide_overflow">
                        <div class="input_container">
                            <div class="width_50">
                                <div class="checkbox_container">
                                    <input type="radio" id="favicon_edit_background_type_solid" name="favicon_edit_background_type" checked />
                                    <label for="favicon_edit_background_type_solid"><span>Solid</span></label>
                                </div>
                            </div>
                            <div class="width_50">
                                <div class="checkbox_container">
                                    <input type="radio" id="favicon_edit_background_type_gradient" name="favicon_edit_background_type" />
                                    <label for="favicon_edit_background_type_gradient"><span>Gradient</span></label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="hide_overflow">
                        <div class="input_container input_container_50">
                            <label>Background Color</label>
                            <input type="color" value="#FE145B" id="favicon_edit_bg_color" />
                        </div>
                        <div class="width_50" id="favicon_edit_background_type_gradient_container">
                            <div class="input_container">
                                <label>Background Color 2</label>
                                <input type="color" value="#FE145B" id="favicon_edit_bg_color2" />
                            </div>
                        </div>
                    </div>

                    <div id="favicon_edit_background_type_gradient_container2" style="margin-top: 10px;">
                        
                        <div class="hide_overflow">

                            <div class="width_50">
                                <p><strong>Gradient Type</strong></p>
                                <div class="width_50">
                                    <div class="checkbox_container">
                                        <input type="radio" id="favicon_edit_background_type_gradient_type_linear" name="favicon_edit_background_gradient_type" checked />
                                        <label for="favicon_edit_background_type_gradient_type_linear"><span>Linear</span></label>
                                    </div>
                                </div>
                                <!--<div class="width_50">
                                    <div class="checkbox_container">
                                        <input type="radio" id="favicon_edit_background_type_gradient_type_radial" name="favicon_edit_background_gradient_type" />
                                        <label for="favicon_edit_background_type_gradient_type_radial"><span>Radial</span></label>
                                    </div>
                                </div>-->
                            </div>

                            <div class="width_50">
                                <div class="input_container">
                                    <label><span id="favicon_edit_linear_degs_text">90</span>&deg;</label>
                                    <input type="range" min="0" max="360" value="90" id="favicon_edit_linear_degs" />
                                </div>
                            </div>

                        </div>

                    </div>

                </div>

                <div id="favicon_edit_container3">
                    <div class="hide_overflow">
                        <div class="width_50">
                            <div class="input_container">
                                <label>Radius <span id="favicon_edit_border_radius_text">(0%)</span></label>
                                <input type="range" min="0" max="50" value="0" id="favicon_edit_border_radius" />
                            </div>
                        </div>
                    </div>

                    <div class="hide_overflow margint10">
                        <div class="width_50">
                            <div class="marginb5"><strong>Border</strong></div>
                            <div id="favicon_edit_border">
                                <div id="favicon_edit_border1" class="favicon_edit_border_item">Enabled</div>
                                <div id="favicon_edit_border2" class="favicon_edit_border_item favicon_edit_border_item_active">Disabled</div>
                            </div>
                        </div>
                    </div>

                    <div id="favicon_edit_border_warning">
                        <strong><i class="fa fa-exclamation-triangle" aria-hidden="true"></i> Scaling Issue</strong>
                        <br />
                        There is a scaling issue when generating borders on larger favicons. 
                    </div>

                    <div id="favicon_edit_border_container">
                        <div class="hide_overflow">
                            <div class="input_container input_container_50">
                                <label>Border Color</label>
                                <input type="color" value="#000000" id="favicon_edit_border_color" />
                            </div>
                            <div class="input_container input_container_50">
                                <label>Border Width <span id="favicon_edit_border_width_text">(1px)</span></label>
                                <input type="range" min="1" max="10" value="1" id="favicon_edit_border_width" />
                            </div>
                        </div>
                    </div>
                </div>

            </div>


        </main>
    </body>
</html>
